# Audit — Secrets: TruffleHog over the git history, reporting only VERIFIED secrets.
#
# WHY THIS GATE EXISTS
# This repository is public. A token pasted into a note, a test or a commit message is
# exposed the moment it is pushed, and deleting it in a later commit does not remove it
# from history. TruffleHog scans the commits a push or pull request adds and checks each
# candidate against its provider; a secret it can verify as live fails the job.
#
# fetch-depth: 0 fetches the full history, because TruffleHog scans commits, not the
# working tree, and a shallow clone would hide everything before the tip.
# --results=verified is the current spelling of the older --only-verified flag: report
# only secrets confirmed live, so the job fails on real leaks and not on every string
# that merely looks like a key.
#
# No path filter: a secret can land in any file. Two things are pinned, because the action
# is only a wrapper: the action itself to the full commit SHA of its v3.97.9 release (a tag
# can be moved; a SHA cannot), and the scanner image it runs through `version:`, which
# otherwise defaults to `latest` and would be a different scanner on every run. Move both
# forward together, deliberately, with the rest of the toolchain.
name: Audit — Secrets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog verified-secrets scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          version: 3.97.9
          extra_args: --results=verified
